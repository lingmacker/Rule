mixed-port: 7890
allow-lan: false
mode: Rule
ipv6: true
log-level: info
external-controller: 127.0.0.1:9090
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxy-providers:
  cc:
    url: https://sub.cocoduck.cc/sub/57547f5632009787/clash
    interval: 3600

proxy-groups:
  - name: 手动选择
    type: select
    include-all: true
    filter: '^(?!.*(我的|流量|官网|时间)).*'
  - name: Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 30
    include-all: true
    filter: '美|港|日|新'
  - name: 美国
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 30
    include-all: true
    filter: '美'
  - name: 香港
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 30
    include-all: true
    filter: '香港|HK'
  - name: 新加坡
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 30
    include-all: true
    filter: '新'
rule-providers:
  proxy:
    behavior: classical
    format: yaml
    url: https://github.com/blackmatrix7/ios_rule_script/raw/refs/heads/master/rule/Clash/Proxy/Proxy_Classical.yaml
    interval: 86400
  china:
    behavior: classical
    format: yaml
    url: https://github.com/blackmatrix7/ios_rule_script/raw/refs/heads/master/rule/Clash/China/China_Classical.yaml
    interval: 86400
  AD:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml
    interval: 86400
  AI:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lingmacker/Rule/refs/heads/master/stash/AI.yaml
    interval: 86400
  Google:
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml
    interval: 86400

rules:
  - DOMAIN-KEYWORD,diabrowser,美国 # dia浏览器
  - DOMAIN-KEYWORD,micu.hk,DIRECT # micu
  - RULE-SET,AI,美国
  - RULE-SET,Google,美国
  - RULE-SET,proxy,Auto
  - RULE-SET,china,DIRECT
  - RULE-SET,AD,REJECT
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-KEYWORD,-cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,手动选择

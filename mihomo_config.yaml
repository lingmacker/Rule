mixed-port: 7890
allow-lan: false
mode: Rule
ipv6: false
log-level: info
external-controller: 127.0.0.1:9090
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 用 IP 直连加密 DNS，避免启动时用明文 DNS 查询上游地址
  default-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

  # 代理节点域名在本地解析，供代理启动
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 国内域名使用国内 DoH
  nameserver-policy:
    "rule-set:china":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    "+.cn":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

  # 命中 DIRECT 的连接需要解析时，也使用国内 DoH
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 其他由 Mihomo 解析的域名，经现有 Auto 代理组查询
  nameserver:
    - "https://dns.google/dns-query#Auto"
    - "https://1.1.1.1/dns-query#Auto"

proxy-providers:
  cc:
    type: http
    url: https://sub.cocoduck.cc/sub/1ff946efef6109b8/clash#COCODUCK
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
      expected-status: '204'

proxy-groups:
  - name: Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: '204'
    include-all: true
    filter: '^(?!.*(我的|流量|官网|时间|无法)).*'
  - name: 美国
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: '204'
    include-all: true
    filter: '美'
  - name: 香港
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: '204'
    include-all: true
    filter: '香港|HK'
  - name: 新加坡
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: '204'
    include-all: true
    filter: '新加坡'
  - name: 日本
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    include-all: true
    filter: 日本
rule-providers:
  proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://github.com/blackmatrix7/ios_rule_script/raw/refs/heads/master/rule/Clash/Proxy/Proxy_Classical.yaml
    interval: 86400
  china:
    type: http
    behavior: classical
    format: yaml
    url: https://github.com/blackmatrix7/ios_rule_script/raw/refs/heads/master/rule/Clash/China/China_Classical.yaml
    interval: 86400
  AD:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml
    interval: 86400
  AI:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lingmacker/Rule/refs/heads/master/stash/AI.yaml
    interval: 86400
  Google:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml
    interval: 86400

rules:
  - DOMAIN-SUFFIX,micu.hk,DIRECT
  - DOMAIN,mumu.nie.netease.com,REJECT
  - RULE-SET,AI,日本
  - RULE-SET,Google,Auto
  - RULE-SET,proxy,Auto
  - RULE-SET,china,DIRECT
  - RULE-SET,AD,REJECT
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-KEYWORD,-cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,Auto

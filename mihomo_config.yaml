mixed-port: 7890
allow-lan: false
mode: Rule
ipv6: false
log-level: info
external-controller: 127.0.0.1:9090
sniffer:
  enable: true
  parse-pure-ip: true
  force-dns-mapping: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxy-providers:
  cc:
    type: http
    url: https://sub
    interval: 3600
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
      expected-status: '204'

proxy-groups:
  - name: 手动选择
    type: select
    include-all: true
    filter: '^(?!.*(我的|流量|官网|时间|无法)).*'
  - name: Auto
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: '204'
    include-all: true
    filter: '美|港|日|新'
  - name: 美国
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: '204'
    include-all: true
    filter: '美'
  - name: 香港
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: '204'
    include-all: true
    filter: '香港|HK'
  - name: 新加坡
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    lazy: true
    expected-status: '204'
    include-all: true
    filter: '新'
rule-providers:
  proxy:
    type: http
    behavior: classical
    format: yaml
    url: https://github.com/blackmatrix7/ios_rule_script/raw/refs/heads/master/rule/Clash/Proxy/Proxy_Classical.yaml
    interval: 86400
  china:
    type: http
    behavior: classical
    format: yaml
    url: https://github.com/blackmatrix7/ios_rule_script/raw/refs/heads/master/rule/Clash/China/China_Classical.yaml
    interval: 86400
  AD:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Clash-Classical.yaml
    interval: 86400
  AI:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/lingmacker/Rule/refs/heads/master/stash/AI.yaml
    interval: 86400
  Google:
    type: http
    behavior: classical
    format: yaml
    url: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.yaml
    interval: 86400

rules:
  - DOMAIN-KEYWORD,diabrowser,美国 # dia浏览器
  - DOMAIN-KEYWORD,micu.hk,DIRECT # micu
  - RULE-SET,AI,美国
  - RULE-SET,Google,美国
  - RULE-SET,proxy,Auto
  - RULE-SET,china,DIRECT
  - RULE-SET,AD,REJECT
  - DOMAIN-SUFFIX,cn,DIRECT
  - DOMAIN-KEYWORD,-cn,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,手动选择
